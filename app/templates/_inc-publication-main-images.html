<h1 class="mb-2 text-2xl font-bold text-gray-900" id="display-title">Images</h1>
<div id="accordion-collapse" data-accordion="collapse">
  {% for i in publication.collections[0].items %}
  <h2 id="accordion-collapse-heading-{{ loop.index }}">
    <button type="button" class="flex items-center justify-between w-full p-5 font-medium rtl:text-right text-gray-500 border border-b-0 border-gray-200{% if loop.first %} rounded-t-xl{% endif %} focus:ring-4 focus:ring-gray-200 hover:bg-gray-100 gap-3" data-accordion-target="#accordion-collapse-body-{{ loop.index }}" aria-expanded="true" aria-controls="accordion-collapse-body-{{ loop.index }}">
      <div><span class="italic item-scientific-name">{{ i.scientific_name }}</span><span class="item-scientific-name-authors">&nbsp;{{ i.source_data.name_authors }}</span></div>
      <svg data-accordion-icon class="w-3 h-3 rotate-180 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5 5 1 1 5"/>
      </svg>
    </button>
  </h2>
  <div id="accordion-collapse-body-{{ loop.index }}" class="hidden" aria-labelledby="accordion-collapse-heading-{{ loop.index }}">
    <div class="p-5 border border-b-0 border-gray-200">
      <p class="mb-2 text-gray-500">
        <button type="button" class="fetch-group-image-button text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 focus:outline-none" data-index={{ loop.index0 }}>iNaturalist</button>
        <button type="button" class="fetch-group-image-button2 text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 focus:outline-none" data-index={{ loop.index0 }}>TaiEOL</button>
        {#<button type="button" class="save-group-image-button text-white bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 focus:outline-none" data-index={{ loop.index0 }}>Save</button>#}
      </p>
      <form id="gallery-form-{{ loop.index0 }}">
        <div class="grid grid-cols-4 md:grid-cols-4 gap-4" id="group-gallery-{{ loop.index0 }}">
        </div>
      </form>
    </div>
  </div>
  {% endfor %}
</div>
