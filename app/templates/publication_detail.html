{% extends "base.html" %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/tom-select.default.min.css') }}">
{% endblock %}

{% block main %}
{% include "_inc-preview-sidebar.html" %}
<!-- Center Content -->
<main class="flex-1 bg-white dark:bg-gray-900 p-6 overflow-y-auto" id="main-content">
  <div id="main-content-sync" class="main-content-panel hidden">
    <button type="button" class="focus:outline-none text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">Sync</button>
    <div>Latest: <span id="main-sync-datetime"></span></div>

      <div class="mt-8">
        <button type="button" id="delete-button" class="focus:outline-none text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-900">delete</button>
      </div>
  </div>
    <div id="main-content-meta" class="main-content-panel hidden">
    <form class="max-w-4xl">
      <div class="mb-5">
        <label for="meta-title" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Title</label>
        <input type="text" id="meta-title" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" required />
      </div>
      <div class="mb-5">
        <label for="meta-authors" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Authors</label>
        <textarea id="meta-authors" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"></textarea>
      </div>
      <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Save</button>
    </form>

  </div>
  <div id="main-content-literatures" class="main-content-panel hidden">
    <h2 class="mb-2 text-lg font-semibold text-gray-900 dark:text-white">LITERATURES</h2>
    <div id="literatures-table-wrapper"></div>

    <select id="literatures-select" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"></select>
    <button type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800" id="literature-add-button">Add</button></a>
  </div>
  <div id="main-content-groups" class="main-content-panel">
    {% include "_inc-publication-main-group.html" %}
  </div>
</main>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='vendor/tom-select.complete.min.js') }}"></script>
<script>
 document.addEventListener('DOMContentLoaded', function () {
   const API_URL = '{{ API_URL }}';
   const itemData = [
     {%- for i in publication.collections[0].items -%}
     { "name": "{{ i.scientific_name}}", "name_id": {{ i.source_data.name_id }}, "rank_id": {{ i.source_data.rank_id }} }{% if not loop.last %},{% endif %}
     {%- endfor -%}
   ];

   /* sidebar and main panel */
   const sidebarNav = document.getElementById('sidebar-nav');
   const mainContent = document.getElementById('main-content');
   const sidebarItems = sidebarNav.querySelectorAll('.sidebar-item');
   const mainContentPanels = mainContent.querySelectorAll('.main-content-panel');
   function switchPanel(mainPanel) {
     sidebarItems.forEach(item => {
       let icon = item.querySelector('svg');
       let label = item.querySelector('span');
       icon.classList.remove('text-gray-900', 'text-gray-500');
       label.classList.remove('text-gray-900', 'text-gray-500');
     });
     mainContentPanels.forEach(panel => {
       panel.classList.add('hidden');
     });
     const targetSidebarItem = sidebarNav.querySelector(`[data-main="${mainPanel}"]`);
     const targetPanel = document.getElementById(`main-content-${mainPanel}`);
     let icon = targetSidebarItem.querySelector('svg');
     let label = targetSidebarItem.querySelector('span');
     icon.classList.add('text-gray-900');
     label.classList.add('text-gray-900');
     targetPanel.classList.remove('hidden');
   }
   sidebarNav.onclick = (e) => {
     const clickedSidebar = event.target.closest('.sidebar-item');
     if (!clickedSidebar) return;
     e.preventDefault();
     const main = clickedSidebar.dataset.main;
     switchPanel(main);
   }

   /* table row detail */
   document.getElementById('item-table-body').addEventListener('click', function(e) {
     const row = e.target.closest('.expandable-row');
     console.log(row);
     if (row) {
       // stop calling modal
       if (e.target.closest('.item-action')) {
         return;
       }
       const detailsRow = row.nextElementSibling;
       const chevron = row.querySelector('.chevron-icon');
       if (detailsRow) {
         detailsRow.classList.toggle('hidden');
         if (chevron) {
           chevron.classList.toggle('rotate-90');
         }
       }
     }
   });

   let deleteButton = document.getElementById('delete-button');
   deleteButton.onclick = (e) => {
     e.preventDefault();
     if (confirm('Are you sure?')) {
       document.location.href = "{{ url_for('main.delete_publication', publication_id=publication.id ) }}";
     }
   };
   const getSpecimenBtn = document.getElementById('get-specimen-btn');
   getSpecimenBtn.onclick = (e) => {
     e.preventDefault();
     fetchAllTBIAData();
   }

   // Function to update row status
   function updateRowStatus(index, status, message, specimenCount = 0) {
     const row = document.querySelector(`tr[data-index="${index}"]`);
     if (!row) return;

     const statusDot = row.querySelector('.status-dot');
     const statusText = row.querySelector('.status-text');
     const spinner = row.querySelector('.spinner');
     const specimenCountDiv = row.querySelector('.specimen-count');
     const countSpan = row.querySelector('.count');
     const selectBtn = row.querySelector('.select-specimen-btn');

     // Hide spinner
     spinner.classList.add('hidden');

     // Update status
     switch(status) {
       case 'loading':
         statusDot.className = 'h-2.5 w-2.5 rounded-full bg-yellow-500 me-2 status-dot';
         statusText.textContent = message || 'Loading...';
         spinner.classList.remove('hidden');
         specimenCountDiv.classList.add('hidden');
         selectBtn.classList.add('hidden');
         break;
       case 'success':
         statusDot.className = 'h-2.5 w-2.5 rounded-full bg-green-500 me-2 status-dot';
         statusText.textContent = 'Complete';
         countSpan.textContent = specimenCount;
         specimenCountDiv.classList.remove('hidden');
         ;
         // Update the text based on whether this is showing found specimens or selected specimens
         const countText = specimenCountDiv.querySelector('.count').nextSibling;
         if (message && message.includes('selected')) {
           countText.textContent = ' selected';
         } else {
           countText.textContent = ' specimens found';
         }
         if (specimenCount > 0) {
           selectBtn.classList.remove('hidden');
           selectBtn.onclick = () => openSpecimenModal(index);
         }
         break;
       case 'error':
         statusDot.className = 'h-2.5 w-2.5 rounded-full bg-red-500 me-2 status-dot';
         statusText.textContent = message || 'Error';
         specimenCountDiv.classList.add('hidden');
         selectBtn.classList.add('hidden');
         break;
       default:
         statusDot.className = 'h-2.5 w-2.5 rounded-full bg-gray-500 me-2 status-dot';
         statusText.textContent = message || 'Ready';
         specimenCountDiv.classList.add('hidden');
         selectBtn.classList.add('hidden');
     }
   }

   // Function to fetch TBIA specimen data for a scientific name
   async function fetchTBIASpecimenData(scientificName, taicolNameId, index) {
     try {
       updateRowStatus(index, 'loading', 'Searching TBIA...');

       // First, search for the name to get taxon key
       const nameSearchUrl = `${API_URL}/api/external/names/taicol/[${taicolNameId}]${scientificName}`;
       const nameResponse = await fetch(nameSearchUrl);

       if (!nameResponse.ok) {
         throw new Error(`Name search failed: ${nameResponse.status}`);
       }

       const nameData = await nameResponse.json();

       if (nameData.status !== 'success' || !nameData.records || nameData.records.length === 0) {
         updateRowStatus(index, 'error', 'No TaiCOL records found');
         return;
       }

       // Use the first taxon key found
       const taxonKey = nameData.records[0].key;
       updateRowStatus(index, 'loading', 'Fetching specimens...');

       // Fetch specimen data using the taxon key
       const specimenUrl = `${API_URL}/api/external/data/tbia/${taxonKey}`;
       const specimenResponse = await fetch(specimenUrl);

       if (!specimenResponse.ok) {
         throw new Error(`Specimen search failed: ${specimenResponse.status}`);
       }

       const specimenData = await specimenResponse.json();

       if (specimenData.status === 'success') {
         const specimenCount = specimenData.records ? specimenData.records.length : 0;
         updateRowStatus(index, 'success', 'Complete', specimenCount);

         // Store the specimen data for later use
         itemData[index].specimenData = specimenData.records;
       } else {
         updateRowStatus(index, 'error', specimenData.message || 'No specimens found');
       }

     } catch (error) {
       console.error(`Error fetching data for ${scientificName}:`, error);
       updateRowStatus(index, 'error', error.message);
     }
   }

   // Function to process all scientific names
   async function fetchAllTBIAData () {
     if (itemData.length <= 0 ) {
       alert('No data available to process');
       return;
     }

     getSpecimenBtn.disabled = true;
     getSpecimenBtn.textContent = 'Processing...';

     try {
       // Process each scientific name one by one with a small delay
       for (let i = 0; i < itemData.length; i++) {
         const item = itemData[i];
         await fetchTBIASpecimenData(item.name, item.name_id, i);

         // Add a small delay between requests to be respectful to the API
         if (i < itemData.length - 1) {
           await new Promise(resolve => setTimeout(resolve, 1000));
         }
       }
     } finally {
       getSpecimenBtn.disabled = false;
       //getSpecimenBtn.textContent = 'Step 1: Get Specimen Data';
       console.log('get TBIA specimen data:', itemData);

       // Check if any specimens were found and move to step 2
       const hasSpecimens = itemData.some(info => info.specimenData && info.specimenData.length > 0);
       if (hasSpecimens) {
         //updateStepper(2);
       }
     }
   }
 });
</script>
{% endblock %}
