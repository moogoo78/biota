{% extends "base.html" %}

{% block subheader_title %}{{ _('出版') }}{% endblock %}
{% block main %}
<main class="flex-1 bg-white dark:bg-gray-900 p-6 overflow-y-auto">
    <div class="relative overflow-x-auto">
        <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
            <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                <tr>
                    <th scope="col" class="px-6 py-3">
                        {{ _('標題') }}
                    </th>
                    <th scope="col" class="px-6 py-3">
                        {{ _('作者') }}
                    </th>
                    <th scope="col" class="px-6 py-3">
                        {{ _('最後更新日期') }}
                    </th>
                    <th scope="col" class="px-6 py-3">

                    </th>
                </tr>
            </thead>
            <tbody>
                {% for i in publications %}
                <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
                    <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                        {{ i.name }}
                    </th>
                    <td class="px-6 py-4">
                        {{ i.author }}
                    </td>
                    <td class="px-6 py-4">

                    </td>
                    <td class="px-6 py-4">
                        <a href="{{ url_for('publication.detail_view', item_id=i.id) }}"><button type="button" class="focus:outline-none text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800 collection-item">{{ _('編輯') }}</button></a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</main>
{% endblock %}
